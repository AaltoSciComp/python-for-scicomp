[project]
name = "calculator_myname"
version = "0.1.0"
description = "Great calculator with amazing mathematics functions"
readme = "README.md"
authors = [
    {name = "Firstname Lastname", email = "firstname.lastname@example.org"}
]
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "scipy>=1.18.1",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "calculator"

